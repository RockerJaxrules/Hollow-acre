# Builds Hollow Acre as real apps on every change: Windows (installer + portable .exe), macOS (.dmg and .zip, for Apple silicon
# and for Intel), Linux (AppImage + .deb), Android (.apk), the web version (upload to itch.io or any website) and the demo for
# Game Jolt. Download them from the run's "Artifacts" section.
# When hollow-acre/desktop/package.json names a desktop version that has no GitHub Release yet (or when the workflow is run by
# hand), the "release" job publishes the Windows, Mac and Linux apps as the release desktop-v<version>, the stable download page
# https://github.com/RockerJaxrules/Hollow-acre/releases/latest, with the update files the installed apps update themselves from.
# (The Mac app has no Apple certificate: it is ad-hoc signed, can't update itself, and points the player to the newest .dmg.)
name: Hollow Acre apps
on:
  push:
    paths: ['hollow-acre/**', '.github/workflows/hollow-acre-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the web build
        run: mkdir -p web && cp -r hollow-acre/2d/index.html hollow-acre/2d/spr hollow-acre/2d/CREDITS.txt hollow-acre/2d/vendor hollow-acre/2d/manifest.webmanifest hollow-acre/2d/icon-192.png hollow-acre/2d/icon-512.png hollow-acre/2d/sw.js hollow-acre/2d/version.json web/
      - uses: actions/upload-artifact@v4
        with:
          name: HollowAcre-web
          path: web
          if-no-files-found: error
      # the Game Jolt browser build: the demo (2d/demo) with the game in it, every path relative (hollow-acre/gamejolt/PAGE.md)
      - name: The Game Jolt build
        run: python3 hollow-acre/2d/tools/mkdemo.py --gamejolt HollowAcre-demo-gamejolt.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HollowAcre-gamejolt-demo
          path: HollowAcre-demo-gamejolt.zip
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows, files: "hollow-acre/desktop/dist/*.exe"}
          - {os: macos-latest, name: mac, files: "hollow-acre/desktop/dist/*.dmg\nhollow-acre/desktop/dist/*-mac-*.zip"}
          - {os: ubuntu-latest, name: linux, files: "hollow-acre/desktop/dist/*.AppImage\nhollow-acre/desktop/dist/*.deb"}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: hollow-acre/desktop}}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run dist
      # the files made and the update files' text, in the log (the artifacts are zips)
      - name: What was built
        shell: bash
        run: ls -l dist; for f in dist/latest*.yml; do [ -e "$f" ] || continue; echo "== $f"; cat "$f"; done
      # each Mac app's signature (ad-hoc, made by build/adhoc-sign.js) and the processor it is for
      - if: matrix.name == 'mac'
        name: The Mac apps
        run: |
          for a in dist/mac*/*.app; do echo "== $a"; codesign -dv "$a" 2>&1 | grep -E 'Identifier|Format|Signature|TeamIdentifier'; codesign --verify --deep --strict "$a" && echo "signature ok"; lipo -archs "$a/Contents/MacOS/Hollow Acre"; done
      - uses: actions/upload-artifact@v4
        with:
          name: HollowAcre-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # what electron-updater reads (latest.yml, latest-linux.yml) and the block maps for smaller updates: a few KB, for the release
      - if: matrix.name != 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: HollowAcre-${{ matrix.name }}-update
          path: |
            hollow-acre/desktop/dist/latest*.yml
            hollow-acre/desktop/dist/*.blockmap
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hollow-acre/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: node copy-game.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: App icon
        run: |
          cp -r icons/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: hollow-acre/mobile/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HollowAcre-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HollowAcre-android
          path: hollow-acre/mobile/HollowAcre-android.apk
          if-no-files-found: error
  release:
    # publishes the desktop apps once per version: a new version in hollow-acre/desktop/package.json, pushed to the game's branch
    # or to main, or a run started by hand (which also refreshes the files of a release that already exists)
    needs: desktop
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/claude/3d-horror-stardew-game-3p7bhh' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: {group: desktop-release, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Is this version released yet?
        run: |
          v=$(node -p "require('./hollow-acre/desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=desktop-v$v" >> "$GITHUB_OUTPUT"
          if gh release view "desktop-v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: go
        run: echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: {name: HollowAcre-windows, path: rel}
      - if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: {name: HollowAcre-windows-update, path: rel}
      - if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: {name: HollowAcre-mac, path: rel}
      - if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: {name: HollowAcre-linux, path: rel}
      - if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: {name: HollowAcre-linux-update, path: rel}
      - if: steps.go.outputs.go == 'true'
        name: Publish the release
        env: {V: '${{ steps.v.outputs.version }}', TAG: '${{ steps.v.outputs.tag }}', EXISTS: '${{ steps.v.outputs.exists }}'}
        run: |
          cd rel && ls -la
          # every file the release promises, and update files that name this version
          for f in "HollowAcre-Setup-$V.exe" "HollowAcre-Portable-$V.exe" "HollowAcre-$V-mac-arm64.dmg" "HollowAcre-$V-mac-x64.dmg" "HollowAcre-$V-mac-arm64.zip" "HollowAcre-$V-mac-x64.zip" HollowAcre-x86_64.AppImage "HollowAcre_${V}_amd64.deb" latest.yml latest-linux.yml; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          grep -q "^version: $V$" latest.yml && grep -q "^version: $V$" latest-linux.yml
          cat > ../notes.md <<EOF
          **Windows:** download \`HollowAcre-Setup-$V.exe\` and run it (it updates itself), or \`HollowAcre-Portable-$V.exe\` to play without installing.
          Windows may say "Windows protected your PC" because the app isn't signed: click **More info**, then **Run anyway**.

          **Mac:** download \`HollowAcre-$V-mac-arm64.dmg\` for a Mac with Apple silicon (M1 or newer), or \`HollowAcre-$V-mac-x64.dmg\` for an Intel Mac
          (Apple menu > **About This Mac** says which). Open it and drag Hollow Acre into **Applications**. The app isn't signed by Apple, so the first time,
          right-click it and choose **Open** (on macOS 15 and later: try to open it once, then **System Settings** > **Privacy & Security** > **Open Anyway**).
          It tells you when a new version is out. The \`.zip\` files hold the same apps.

          **Steam Deck and Linux:** download \`HollowAcre-x86_64.AppImage\` (it updates itself), make it executable, and add it to Steam as a Non-Steam Game.
          On Ubuntu or Debian you can install \`HollowAcre_${V}_amd64.deb\` instead.

          The app always plays the newest version of the game from the website, and keeps a copy for playing offline.
          Step-by-step instructions: https://github.com/RockerJaxrules/Hollow-acre/blob/${GITHUB_SHA}/hollow-acre/desktop/README.md
          EOF
          sed -i 's/^          //' ../notes.md
          if [ "$EXISTS" = true ]; then gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hollow Acre $V (Windows, Mac, Linux, Steam Deck)" --notes-file ../notes.md --latest; fi
