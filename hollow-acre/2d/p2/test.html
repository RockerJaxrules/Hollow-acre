<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Hollow Acre: Part 2 test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; z-index: 3; font: 600 12px/1.2 -apple-system, system-ui, sans-serif; color: rgba(220, 230, 240, .82); text-shadow: 0 1px 2px #000; }
  #fps { top: calc(env(safe-area-inset-top) + 10px); left: 12px; pointer-events: none; }
  #q { top: calc(env(safe-area-inset-top) + 6px); right: 10px; padding: 7px 11px; border-radius: 14px; background: rgba(20, 24, 30, .6); border: 1px solid rgba(200, 210, 220, .25); cursor: pointer; }
  #cap { bottom: calc(env(safe-area-inset-bottom) + 12px); left: 0; right: 0; text-align: center; pointer-events: none; font-weight: 500; opacity: .75; }
  #tap { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 40px); transform: translateX(-50%); padding: 12px 20px; border-radius: 22px; background: rgba(10, 12, 16, .55); border: 1px solid rgba(220, 230, 240, .3);
    color: #dde6ee; font: 600 15px -apple-system, system-ui, sans-serif; transition: opacity .8s; cursor: pointer; }
  #fade { position: fixed; inset: 0; z-index: 2; background: #000; opacity: 1; pointer-events: none; }
  #err { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #dde; font: 15px -apple-system, system-ui, sans-serif; background: #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="fade"></div>
<div id="fps" class="hud">…</div>
<div id="q" class="hud">Quality: Auto</div>
<div id="tap">Tap for sound</div>
<div id="cap" class="hud">Part 2 test · drag to look around · tap the quality button to change it</div>
<div id="load" class="hud" style="top:50%;left:0;right:0;text-align:center;z-index:5;font-weight:500">Loading the mountain road…</div>
<div id="err"></div>
<script>
  (function () {
    var c = document.createElement('canvas');
    if (!c.getContext('webgl2')) { var e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = 'This test needs WebGL 2. Try Safari on iOS 15 or newer, or Chrome.'; }
    window.addEventListener('error', function (ev) { var e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = 'Something went wrong: ' + ev.message; });
  })();
</script>
<script type="module" src="test.js?v=1"></script>
</body>
</html>
